# ===================================================================
# Netlify Configuration for IDX AI Stock Trader Dashboard
# 100% Free JAMstack Static Hosting (No Backend Required)
# ===================================================================

[build]
  publish = "frontend"

# Map /static/* assets to root files inside frontend directory
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Transparent API rewrites to static JSON files
[[redirects]]
  from = "/api/health"
  to = "/data/health.json"
  status = 200

[[redirects]]
  from = "/api/stocks"
  to = "/data/stocks.json"
  status = 200

[[redirects]]
  from = "/api/backtest/summary"
  to = "/data/backtest_summary.json"
  status = 200

[[redirects]]
  from = "/api/models/comparison"
  to = "/data/model_comparison.json"
  status = 200

[[redirects]]
  from = "/api/models/registry"
  to = "/data/model_registry.json"
  status = 200

# Fallback for single page navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
