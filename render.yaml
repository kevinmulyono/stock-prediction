# ===================================================================
# Render.com Blueprint for FastAPI Backend
# Deploys Python FastAPI Server with PyTorch, LightGBM, and SQLite
# ===================================================================

services:
  - type: web
    name: idx-stock-prediction-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
