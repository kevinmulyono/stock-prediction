name: Daily Market Data Sync & Static Export

on:
  schedule:
    # Run every Monday-Friday at 11:00 UTC (18:00 WIB, after IDX market close)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-predict-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests SQLAlchemy scikit-learn lightgbm joblib
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Sync Live Market Data (Yahoo Finance)
        run: |
          python src/data/sync_daily.py

      - name: Run Daily Prediction Pipeline (T+1 Forecast)
        run: |
          python src/models/predict_daily.py --model ensemble
          python src/models/predict_daily.py --model lstm || true
          python src/models/predict_daily.py --model lightgbm || true

      - name: Export Static JSON Files for Netlify
        run: |
          python src/export_static_data.py

      - name: Commit and Push Updated Static Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/data/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-sync live market data & T+1 predictions [skip ci]"
            git push
          fi
